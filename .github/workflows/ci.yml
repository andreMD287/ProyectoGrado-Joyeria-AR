name: CI

on:
  push:
    # Todas las ramas, no solo main. En este equipo las ramas se integran por
    # merge directo y no por pull request, asi que sin esto una rama pasaria
    # por CI recien despues de estar mergeada: el fallo se descubriria ya
    # dentro de main, contaminando la rama de todos.
    branches: ['**']
  pull_request:
    branches: [main]

# El job solo lee el repositorio; no publica nada ni escribe en la API.
permissions:
  contents: read

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Análisis, pruebas y APK debug
    runs-on: ubuntu-latest
    # El primer build descarga Gradle, SDK y NDK; 20 min se queda corto si no hay caché.
    timeout-minutes: 25

    steps:
      # Sin `lfs: true` a proposito. Descargar los modelos en cada corrida son
      # unos 134 MB contra la cuota mensual de LFS, que se agotaria en una
      # semana de trabajo normal. Consecuencia a tener presente: el APK que se
      # compila mas abajo lleva punteros de 130 bytes en vez de los modelos, y
      # sirve para detectar roturas de compilacion, no para medir su tamano.
      - uses: actions/checkout@v5

      # GitHub rechaza cualquier fichero de mas de 100 MB que no este en LFS, y
      # lo hace al recibir el push: para entonces este workflow ni siquiera ha
      # empezado, y el unico arreglo posible ya es reescribir la historia, que
      # deja huerfanas las ramas de todo el equipo. Ya paso una vez.
      #
      # Este paso avisa muy por debajo del limite, mientras el arreglo todavia
      # es cambiar un fichero. Comprueba la pertenencia a LFS de forma
      # explicita, para que siga siendo correcto aunque el checkout pase a
      # descargar el contenido de LFS.
      - name: Verificar que no haya binarios grandes fuera de LFS
        run: |
          UMBRAL_MB=45
          umbral=$((UMBRAL_MB * 1024 * 1024))

          # Rutas que LFS gestiona. Funciona aunque solo haya punteros en disco.
          git lfs ls-files -n | sort -u > /tmp/en-lfs.txt || : > /tmp/en-lfs.txt

          fallo=0
          while IFS= read -r fichero; do
            [ -f "$fichero" ] || continue
            grep -Fxq "$fichero" /tmp/en-lfs.txt && continue
            bytes=$(stat -c%s "$fichero")
            if [ "$bytes" -gt "$umbral" ]; then
              echo "::error file=$fichero::$fichero pesa $((bytes / 1048576)) MB y no esta en Git LFS"
              fallo=1
            fi
          done < <(git ls-files)

          if [ "$fallo" -ne 0 ]; then
            echo
            echo "Antes de commitear un binario grande, ponlo en LFS:"
            echo "    git lfs track \"*.glb\""
            echo "    git add .gitattributes"
            echo
            echo "Si el fichero ya esta commiteado, avisa al equipo antes de"
            echo "migrarlo: la migracion reescribe la historia y obliga a que"
            echo "todos reseteen sus ramas."
            exit 1
          fi
          echo "Sin binarios fuera de LFS por encima de ${UMBRAL_MB} MB."

      # Java 17 = android/app/build.gradle.kts. cache: gradle evita re-descargar
      # dependencias nativas en cada corrida (ML Kit, MediaPipe, cámara).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Versión fijada a la que usa el equipo; subirla debe ser una decisión
      # explícita, no un efecto colateral del canal stable.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # analysis_options.yaml ya excluye mvp-reference/ y spikes/.
      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas unitarias y de widget
        run: flutter test

      # Única red para roturas nativas de Android (manifest merger, Gradle,
      # plugins JNI). flutter test no las ve. Si esta corrida sale roja por
      # licencias/NDK del runner, se quita el paso antes de mergear.
      - name: Compilar APK debug
        run: flutter build apk --debug
