name: jewelry_ar
description: "Visualizacion virtual de joyeria con Realidad Aumentada"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Estado + inyección de dependencias (base de la arquitectura) ──
  flutter_riverpod: ^2.6.1

  # ── Navegación declarativa ──
  go_router: ^14.6.2

  # ── Realidad aumentada y visor 3D (stack validado) ──
  ar_flutter_plugin_2: ^0.0.3       # ARCore (Android) / ARKit (iOS)
  model_viewer_plus: ^1.10.0        # Visor GLB con PBR (WebView)
  webview_flutter: ^4.14.0          # Puente JS al <model-viewer> para orientacion en vivo

  # ── Detección de landmarks ──
  # MediaPipe manos (JNI, Android-only) — pulseras.
  # Fork propio de la v3.0.0: el plugin publicado solo serializa los landmarks
  # normalizados, cuya `z` es profundidad relativa en unidades de imagen. El
  # fork expone además `worldLandmarks` (métricos, en metros), que son los que
  # permiten reconstruir la orientación 3D real de la mano. Se fija el commit,
  # no la rama, para que el CI resuelva siempre lo mismo.
  # No se forkeó `main` (3.1.0) porque exige Dart ^3.12 y el proyecto va en 3.11.5.
  hand_landmarker:
    git:
      url: https://github.com/andreMD287/hand_landmarker.git
      ref: 1f2abc981ee794781cefd225758a18a89586b935
  google_mlkit_face_detection: ^0.13.2   # rostro — aretes (B3)
  google_mlkit_pose_detection: ^0.14.0   # pose/hombros — collares (B2)

  # ── Cámara, permisos, matemática ──
  camera: ^0.12.0
  camera_platform_interface: ^2.10.0  # reconstruir CameraImage dentro del isolate de detección (B5)
  permission_handler: ^11.4.0
  vector_math: ^2.1.0

  # ── Diagnóstico ──
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

# Nota: la generación de código (freezed / json_serializable / build_runner)
# se incorporará cuando se adopten entidades inmutables generadas; por ahora
# el scaffolding usa clases Dart planas para no depender de build_runner.

flutter:
  uses-material-design: true

  assets:
    - assets/catalog/catalog.json
    - assets/models/
